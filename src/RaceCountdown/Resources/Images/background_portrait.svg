<?xml version="1.0" encoding="UTF-8"?>
<!--
  Countdown page background, portrait crop (plan §9). Original artwork: sunset over Mount Panorama with the lit
  track ribbon climbing the hill and speed streaks. The page lays a dark gradient over it so text stays readable.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140A2A" />
      <stop offset="0.28" stop-color="#2B124C" />
      <stop offset="0.5" stop-color="#B0185E" />
      <stop offset="0.64" stop-color="#FF6A00" />
      <stop offset="0.72" stop-color="#FFC21A" />
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF1C2" />
      <stop offset="0.35" stop-color="#FFC21A" />
      <stop offset="1" stop-color="#FF6A00" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="0.8" stop-color="#FFE38A" stop-opacity="0.7" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E6B3A" />
      <stop offset="1" stop-color="#10291A" />
    </linearGradient>
    <linearGradient id="track" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC21A" />
      <stop offset="1" stop-color="#FF6A00" />
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#sky)" />

  <!-- Stars -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="120" cy="140" r="3" /><circle cx="310" cy="90" r="2" /><circle cx="520" cy="200" r="2.5" />
    <circle cx="760" cy="120" r="3" /><circle cx="960" cy="240" r="2" /><circle cx="200" cy="360" r="2" />
    <circle cx="880" cy="420" r="2.5" /><circle cx="640" cy="330" r="1.8" /><circle cx="60" cy="520" r="1.8" />
  </g>

  <!-- Sun on the horizon -->
  <circle cx="700" cy="1330" r="420" fill="url(#sun)" />

  <!-- Speed streaks -->
  <g stroke-linecap="round">
    <line x1="-40" y1="980" x2="620" y2="940" stroke="url(#streak)" stroke-width="6" />
    <line x1="160" y1="1060" x2="1120" y2="1000" stroke="url(#streak)" stroke-width="4" />
    <line x1="-60" y1="1140" x2="520" y2="1110" stroke="url(#streak)" stroke-width="3" />
    <line x1="420" y1="860" x2="1100" y2="820" stroke="url(#streak)" stroke-width="3" />
  </g>

  <!-- Distant ranges -->
  <path d="M0,1330 C120,1290 220,1310 330,1270 C450,1230 560,1260 680,1240 C800,1220 930,1260 1080,1230 L1080,1920 L0,1920 Z" fill="#7A1450" opacity="0.75" />
  <path d="M0,1400 C150,1370 260,1390 400,1360 C540,1330 700,1370 860,1350 C960,1338 1030,1350 1080,1344 L1080,1920 L0,1920 Z" fill="#4A1040" opacity="0.85" />

  <!-- Mount Panorama -->
  <path d="M0,1560 C120,1520 240,1470 380,1400 C500,1340 620,1300 740,1320 C860,1340 960,1400 1080,1440 L1080,1920 L0,1920 Z" fill="url(#hill)" />

  <!-- The circuit on the hillside, lit: Pit Straight, Mountain Straight, the top section, Conrod Straight -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140,1700 L600,1690 Q660,1688 650,1650 L640,1560 Q636,1520 660,1470 Q690,1420 740,1400 Q780,1386 760,1360 Q740,1336 700,1350 Q640,1372 600,1350 Q560,1330 520,1360 Q470,1400 420,1420 L170,1640 Q130,1680 140,1700 Z"
          stroke="#FF6A00" stroke-width="22" opacity="0.35" />
    <path d="M140,1700 L600,1690 Q660,1688 650,1650 L640,1560 Q636,1520 660,1470 Q690,1420 740,1400 Q780,1386 760,1360 Q740,1336 700,1350 Q640,1372 600,1350 Q560,1330 520,1360 Q470,1400 420,1420 L170,1640 Q130,1680 140,1700 Z"
          stroke="url(#track)" stroke-width="8" />
  </g>

  <!-- Foreground -->
  <path d="M0,1780 C200,1740 420,1760 640,1730 C820,1706 960,1730 1080,1720 L1080,1920 L0,1920 Z" fill="#0B1D12" />
  <!-- Gum trees -->
  <g fill="#0B1D12">
    <path d="M880,1730 C870,1660 900,1610 940,1600 C990,1590 1010,1640 990,1690 C1010,1700 1000,1730 980,1730 Z" />
    <path d="M60,1790 C40,1720 80,1680 110,1680 C150,1680 160,1730 140,1790 Z" />
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Home-screen widget background (plan §9): a low-detail crop of the page background so text stays readable at
  small sizes. The dark band on the left is where the widget text sits.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B124C" />
      <stop offset="0.55" stop-color="#B0185E" />
      <stop offset="0.8" stop-color="#FF6A00" />
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#140A2A" stop-opacity="0.75" />
      <stop offset="0.6" stop-color="#140A2A" stop-opacity="0.35" />
      <stop offset="1" stop-color="#140A2A" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#sky)" />
  <circle cx="610" cy="320" r="120" fill="#FFC21A" opacity="0.55" />
  <path d="M0,300 C150,280 300,290 450,262 C580,238 700,250 800,240 L800,400 L0,400 Z" fill="#7A1450" opacity="0.8" />
  <path d="M0,360 C160,340 320,300 480,280 C600,266 700,290 800,300 L800,400 L0,400 Z" fill="#2E6B3A" />
  <path d="M500,372 L690,368 Q712,367 709,352 L704,318 Q700,300 712,292 Q726,286 717,278 Q706,272 690,280 Q670,288 652,280 Q634,274 620,286 L520,352 Q500,366 500,372 Z"
        fill="none" stroke="#FFC21A" stroke-width="5" stroke-linejoin="round" />
  <rect width="800" height="400" fill="url(#shade)" />
</svg>
